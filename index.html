
<!DOCTYPE html>
<html>
<head>
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>☕ Coffee House</h1>
    <a href="#menu">Our Menu</a>
    <a href="#cart">Shopping Cart</a>
</header>

<section class="hero">
    <h2>Welcome to Coffee House</h2>
    <p>Fresh Coffee, Fresh Mood!</p>
</section>

<section id="menu">
    <h2>Our Coffee Menu</h2>

    <div class="product">
        <h3>Espresso</h3>
        <p>Rs. 350</p>
        <button onclick="addToCart('Espresso',350)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Cappuccino</h3>
        <p>Rs. 450</p>
        <button onclick="addToCart('Cappuccino',450)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <h3>Latte</h3>
        <p>Rs. 500</p>
        <button onclick="addToCart('Latte',500)">
            Add to Cart
        </button>
    </div>
</section>

<section id="cart">
    <h2>Shopping Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total: Rs. <span id="total">0</span></h3>
</section>

<script src="script.js"></script>
</body>
</html>
